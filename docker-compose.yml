services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lagportal}
      POSTGRES_USER: ${POSTGRES_USER:-lagportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      EDI_ROOT: /data/clients
      LAG_COLUMN_MAP_JSON: ${LAG_COLUMN_MAP_JSON:-{}}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-lagportal}
      POSTGRES_USER: ${POSTGRES_USER:-lagportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./client-data:/data/clients:ro
      - ./local-agent/runtime:/agent-config
    command: sh -c 'python manage.py makemigrations claims --noinput && python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000'
  indexer:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-lagportal}
      POSTGRES_USER: ${POSTGRES_USER:-lagportal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      EDI_ROOT: /data/clients
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./client-data:/data/clients:ro
    command: python manage.py process_folder_scans --watch --interval 30
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c 'npm install && npm run dev'
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - '5173:5173'
    depends_on:
      - backend
volumes:
  postgres_data:
  frontend_node_modules:
